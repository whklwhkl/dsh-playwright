# playwright-browser bundle layer — applied on top of a dsh profile's composition.
#
# One row: the host plugin registering the browser_* model tools. It requires
# playwright-core directly (this is a normal Node module, unlike a dynamic
# plugin), launches Chromium in-process, and owns the browser lifecycle via
# ctx.effect.
- insert:
    - id: playwright-browser
      name: playwright-browser
